[project]
name = "occamforge"
version = "2.0.0"
description = "Open-source desktop tool for converting Blender models into game-ready assets."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PaiPai121" }]
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
occamforge = "assetforge.app.main:main"
occamforge-analyze = "assetforge.app.cli:main"
occamforge-optimize = "assetforge.app.optimize_cli:main"
occamforge-export-fbx = "assetforge.app.export_cli:main"
occamforge-export-fbx-strict = "assetforge.app.export_strict_cli:main"
occamforge-validate = "assetforge.app.validate_cli:main"
occamforge-build-cs = "assetforge.app.build_cs_cli:main"
occamforge-real-preview = "assetforge.app.real_preview_cli:main"
occamforge-preprocess = "assetforge.app.preprocess_cli:main"
occamforge-geometry-report = "assetforge.app.geometry_report_cli:main"
occamforge-simplification-report = "assetforge.app.simplification_report_cli:main"
occamforge-qem-heatmap = "assetforge.app.qem_heatmap_cli:main"
occamforge-scale-analysis = "assetforge.app.scale_analysis_cli:main"
occamforge-collapse-impact = "assetforge.app.collapse_impact_cli:main"
assetforge = "assetforge.app.main:main"
assetforge-analyze = "assetforge.app.cli:main"
assetforge-optimize = "assetforge.app.optimize_cli:main"
assetforge-export-fbx = "assetforge.app.export_cli:main"
assetforge-export-fbx-strict = "assetforge.app.export_strict_cli:main"
assetforge-validate = "assetforge.app.validate_cli:main"
assetforge-build-cs = "assetforge.app.build_cs_cli:main"
assetforge-real-preview = "assetforge.app.real_preview_cli:main"
assetforge-preprocess = "assetforge.app.preprocess_cli:main"
assetforge-geometry-report = "assetforge.app.geometry_report_cli:main"
assetforge-simplification-report = "assetforge.app.simplification_report_cli:main"
assetforge-qem-heatmap = "assetforge.app.qem_heatmap_cli:main"
assetforge-scale-analysis = "assetforge.app.scale_analysis_cli:main"
assetforge-collapse-impact = "assetforge.app.collapse_impact_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assetforge"]
artifacts = [
    "src/assetforge/analysis/*.py",
    "src/assetforge/gui/web/*.html",
    "src/assetforge/gui/web/*.css",
    "src/assetforge/gui/web/*.js",
    "src/assetforge/blender/scripts/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
