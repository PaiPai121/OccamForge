[project]
name = "assetforge"
version = "0.1.0"
description = "Desktop pipeline tool for converting Blender vehicle models into game-ready assets."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AssetForge" }]
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
assetforge = "assetforge.app.main:main"
assetforge-analyze = "assetforge.app.cli:main"
assetforge-optimize = "assetforge.app.optimize_cli:main"
assetforge-export-fbx = "assetforge.app.export_cli:main"
assetforge-export-fbx-strict = "assetforge.app.export_strict_cli:main"
assetforge-validate = "assetforge.app.validate_cli:main"
assetforge-build-cs = "assetforge.app.build_cs_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assetforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
